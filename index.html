<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10100e">
  <meta name="description" content="Invitación a los 50 años de Araceli. 24 de octubre de 2026, 7:00 p. m.">
  <title>Mis 50 años · Araceli</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%2310100e'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='serif' font-size='36' fill='%23dec47e'%3E50%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="start-screen" id="start-screen">
    <div class="start-panel">
      <span class="start-kicker">UNA NOCHE MUY ESPECIAL</span>
      <h2>Mis 50 años</h2>
      <p>Araceli · 24 de octubre de 2026</p>
      <button id="start-button" type="button">Toca aquí para comenzar</button>
    </div>
  </div>
  <button class="music-control" id="music-control" type="button" aria-label="Pausar música" title="Pausar música" hidden>♫ <span>Música: encendida</span></button>
  <audio id="background-music" src="assets/musica.mp3" loop preload="none"></audio>
  <main id="inicio">
    <h1 class="sr-only">Invitación a los 50 años de Araceli</h1>
    <div class="slides">
      <section class="slide"><img src="assets/1.webp" alt="Mis 50 años. Araceli. 24 de octubre de 2026 a partir de las 7:00 p. m." fetchpriority="high"></section>
      <section class="slide"><img src="assets/2.webp" alt="Celebremos juntos. Hay momentos que se atesoran para siempre y llegar a mis 50 años es uno de ellos." loading="lazy"></section>
      <section class="slide"><img src="assets/3.webp" alt="Acompáñame a celebrar el sábado 24 de octubre a partir de las 7:00 p. m." loading="lazy"></section>
      <section class="slide location"><img src="assets/4.webp" alt="Ubicación: Rincón del Country Eventos, avenida Eugenio Garza Sada número 4926, colonia Sierra Ventana, Monterrey, Nuevo León." loading="lazy"><a class="overlay-link map-link" href="https://www.google.com/maps/search/?api=1&amp;query=Rinc%C3%B3n%20del%20Country%20Eventos%2C%20Av.%20Eugenio%20Garza%20Sada%204926%2C%20Monterrey%2C%20Nuevo%20Le%C3%B3n" target="_blank" rel="noopener noreferrer" aria-label="Ver ubicación de Rincón del Country Eventos en Google Maps"><span aria-hidden="true">📍</span> Ver ubicación en Google Maps</a></section>
      <section class="slide"><img src="assets/5.webp" alt="Código de vestimenta: elegante casual. Elige tu mejor look en tonos oscuros. El dorado queda reservado para la cumpleañera." loading="lazy"></section>
      <section class="slide"><img src="assets/6.webp" alt="Tu presencia es el mejor regalo. Si deseas tener un detalle conmigo, puedes elegir entre un regalito o un sobre." loading="lazy"></section>
      <section class="slide confirmation" id="confirmar"><img src="assets/7.webp" alt="Confirma tu asistencia por WhatsApp o mediante el formulario para compartir esta noche con Araceli." loading="lazy"><div class="confirm-actions"><a href="https://wa.me/528117980813?text=Hola%2C%20confirmo%20mi%20asistencia%20a%20tus%2050%20a%C3%B1os." target="_blank" rel="noopener noreferrer" aria-label="Confirmar asistencia por WhatsApp al 81 1798 0813"><img src="assets/confirmawhatsapp.webp" alt="Confirma por WhatsApp: 81 1798 0813"></a><a href="https://docs.google.com/forms/d/e/1FAIpQLSfyHLB7PIbFFrsgDTpNVajygfhsShKjaIIpmyboNFHMc9tG7g/viewform?usp=publish-editor" target="_blank" rel="noopener noreferrer" aria-label="Confirmar asistencia en el formulario de Google"><img src="assets/CLICKAQUI.webp" alt="Confirma en el formulario: click aquí"></a></div></section>
      <section class="slide"><img src="assets/8.webp" alt="Te espero para compartir una noche inolvidable. Araceli, 24 de octubre de 2026. ¡No faltes!" loading="lazy"></section>
    </div>
  </main>
  <script>
    const music = document.getElementById('background-music');
    const control = document.getElementById('music-control');
    const start = document.getElementById('start-screen');
    function updateMusicControl() {
      const playing = !music.paused;
      control.querySelector('span').textContent = playing ? 'Música: encendida' : 'Música: pausada';
      control.setAttribute('aria-label', playing ? 'Pausar música' : 'Reproducir música');
      control.title = playing ? 'Pausar música' : 'Reproducir música';
    }
    document.getElementById('start-button').addEventListener('click', async () => {
      start.hidden = true;
      control.hidden = false;
      try { await music.play(); } catch (error) { /* Se puede iniciar desde el control. */ }
      updateMusicControl();
    });
    control.addEventListener('click', async () => {
      if (music.paused) { try { await music.play(); } catch (error) {} }
      else music.pause();
      updateMusicControl();
    });
  </script>
</body>
</html>
